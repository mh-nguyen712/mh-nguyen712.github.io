---
layout: default
---

<article class="page project">
  <p class="back"><a href="{{ '/projects/' | relative_url }}">← All projects</a></p>
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.role }}{% if page.role and page.years %} · {% endif %}{{ page.years }}</p>
    <p class="lead">{{ page.summary }}</p>
    <div class="links">
      {% for link in page.links %}
      <a class="pill" href="{{ link.url | relative_url }}">{{ link.name }}</a>
      {% endfor %}
    </div>
  </header>
  {% if page.image %}
  <figure class="project-figure"><img src="{{ page.image | prepend: '/assets/img/' | relative_url }}" alt="{{ page.title }}" /></figure>
  {% endif %}
  <div class="prose">{{ content }}</div>
</article>
