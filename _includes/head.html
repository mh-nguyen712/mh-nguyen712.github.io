<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% if page.title and page.url != "/" %}
<title>{{ page.title }} · {{ site.title }}</title>
{% else %}
<title>{{ site.title }}</title>
{% endif %}
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | strip }}" />
<meta name="author" content="{{ site.author.name }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<!-- Favicon: dot-matrix "H" (source: assets/img/favicon.svg; favicon.ico and the PNG are exported from it) -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48" />
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml" />
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" />

<!-- Apply the saved theme before the page paints (dark is the default) -->
<script>
  try {
    if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light";
  } catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
