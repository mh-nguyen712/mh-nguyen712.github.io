# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

title: Minh Hai Nguyen
description: >-
  Minh Hai Nguyen — PhD candidate in applied mathematics at the University of Toulouse,
  working on inverse problems, computational imaging and diffusion models.
url: https://mh-nguyen712.github.io
baseurl: ""
lang: en

# Shown in the footer
footer_text: >-
  Built with <a href="https://jekyllrb.com/">Jekyll</a>, hosted on <a href="https://pages.github.com/">GitHub Pages</a>.

# Top navigation, in order. Edit this list to add/remove pages from the menu.
nav:
  - title: About
    url: /
  - title: News
    url: /news/
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: Teaching
    url: /teaching/
  - title: CV
    url: /cv/

# Number of news items shown on the home page (all are on /news/)
home_news_limit: 5

# -----------------------------------------------------------------------------
# Contact & profiles (leave empty to hide)
# -----------------------------------------------------------------------------

author:
  name: Minh Hai Nguyen
  email: nguyenhai7120qh@gmail.com
  github: mh-nguyen712
  scholar: T_vUKOkAAAAJ
  linkedin: minh-hai-nguyen-7120
  orcid: 0009-0002-6851-9215

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: projects }
    values: { layout: project }

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar reads _bibliography/papers.bib)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Nguyen]
  first_name: [Minh Hai, Minh-Hai]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
  sort_by: year,month
  order: descending

# Custom fields stripped from the "BibTeX" box shown to visitors
filtered_bibtex_keywords: [abbr, abstract, bibtex_show, code, html, pdf, preview, selected, slides, poster, website, video, note_web]

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

markdown: kramdown
kramdown:
  input: GFM
include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - todo_before_push.sh
  - vendor
sass:
  style: compressed

plugins:
  - jekyll-scholar
  - jekyll-sitemap
